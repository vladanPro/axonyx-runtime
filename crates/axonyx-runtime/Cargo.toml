[package]
name = "axonyx-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
rust-version.workspace = true
description = "Runtime contract and execution layer for Axonyx applications"
readme = "../../README.md"
keywords = ["axonyx", "runtime", "ui", "rust", "framework"]
categories = ["web-programming", "gui"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hmac.workspace = true
sha2.workspace = true
rusqlite.workspace = true
postgres.workspace = true
r2d2.workspace = true
r2d2_postgres.workspace = true
postgres-protocol.workspace = true
postgres-types.workspace = true
tokio-postgres.workspace = true
tokio-postgres-rustls.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
webpki-roots.workspace = true
base64ct.workspace = true
zeroize.workspace = true
zeroize_derive.workspace = true
chrono.workspace = true
uuid.workspace = true
bytes.workspace = true
axonyx-core = { version = "0.3.0", path = "../axonyx-core" }
axum = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["net", "rt-multi-thread"] }

[features]
default = []
axum = ["dep:axum", "dep:futures-util", "dep:tokio"]
