name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.82.0
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Run strict Clippy lint gate
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Verify bundled state WASM ABI
        run: node scripts/verify-state-wasm.mjs

      - name: Verify typed browser state bridge
        run: node scripts/verify-state-bridge.mjs

      - name: Install browser test dependencies
        run: npm ci

      - name: Audit browser test dependencies
        run: npm audit --audit-level=high

      - name: Verify Reactive Each in Chromium
        run: npm run test:reactive-each

      - name: Package axonyx-macros
        run: cargo package -p axonyx-macros --allow-dirty --no-verify

      - name: Summarize release-gate expectations
        shell: bash
        run: |
          {
            echo "## Release Gate Summary"
            echo
            echo "- \`cargo test --workspace\` passed."
            echo "- Typed \`List<Optional<Post>>\` state crossed the browser/WASM bridge."
            echo "- Reactive \`Each\` insert/update/remove/reorder passed in Chromium without requests or VDOM replacement."
            echo "- \`cargo package -p axonyx-macros --allow-dirty --no-verify\` passed."
            echo "- \`axonyx-core\` and \`axonyx-runtime\` are validated after publish order and crates.io propagation."
            echo "- Expected publish order: \`axonyx-macros\` -> \`axonyx-core\` -> \`axonyx-runtime\`."
          } >> "$GITHUB_STEP_SUMMARY"
